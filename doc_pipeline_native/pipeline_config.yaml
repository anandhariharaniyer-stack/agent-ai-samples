# Documentation Pipeline Configuration - Native Python (OpenAI-compatible)

pipeline:
  model: "gpt-4"
  base_url: "https://api.openai.com/v1"
  temperature: 0.3
  max_tokens: 4000

documentation:
  template: "default"
  output_format: "markdown"

enrichment:
  sources:
    - "./docs/"
    - "./knowledge/"

verification:
  confidence_threshold: 0.7
  flag_for_review: true

scheduling:
  trigger: "on_pr_merge"    # on_pr_merge | on_release | scheduled
  scope: "changed_modules"  # changed_modules | full
  # cron: "0 9 * * 1"      # Weekly Monday 9am (for scheduled trigger)
